name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile
        shell: cmd
        run: call Build.cmd --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rustdesk-hdr-helper-windows
          path: RustDeskHDRhelper.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: rustdesk-hdr-helper-windows
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-running a successful tag build updates its assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/RustDeskHDRhelper.exe --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/RustDeskHDRhelper.exe \
              --verify-tag --title "rustdesk-hdr-helper $RELEASE_TAG" \
              --generate-notes "${flags[@]}"
          fi
